name: CI · Express Homework 63.1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 · 100 Vitest checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check JavaScript syntax
        run: |
          find src -name "*.mjs" -exec node --check {} \;
          node --check src/public/js/demo.js

      - name: Run Vitest
        run: npm test
